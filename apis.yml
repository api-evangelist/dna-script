aid: dna-script
name: DNA Script
description: 'DNA Script is a synthetic-biology company founded in 2014 in Paris, France,
  with US operations in South San Francisco, that pioneered Enzymatic DNA Synthesis
  (EDS) — a water-based, template-free, lower-carbon alternative to phosphoramidite
  chemistry. Its flagship product, the SYNTAX System, is a benchtop DNA printer that
  synthesizes, desalts, quantifies and normalizes up to 96 custom oligonucleotides
  in parallel (up to 120 nt on-instrument, up to 500 nt via ordered EDS oligos), giving
  laboratories same-day, on-premise production of custom DNA. The instrument is paired
  with SYNTAX System Software on the instrument touchscreen and a separate Console
  Software layer — offered cloud-hosted or on-premises — through which customers upload
  sequence files, design plate templates, schedule and monitor synthesis runs across
  a fleet of instruments, track reagent and consumable levels, and review run reports.
  The company also markets the ENCODEX DNA biomanufacturing platform for larger-scale
  enzymatic DNA production. DNA Script publishes no public developer portal, no OpenAPI
  and no documented API program; the Console Software is reached through a customer-authenticated
  GraphQL endpoint at syntax.dnascript.com.'
