apis:
- aid: dna-script:syntax-console
  name: DNA Script SYNTAX Console GraphQL API
  description: 'The GraphQL API behind DNA Script''s SYNTAX Console Software — the
    fleet-management layer customers use to design plate templates, upload oligo sequence
    files, schedule and start synthesis runs, monitor instrument status, consumables
    and run progress, and retrieve run reports across their SYNTAX instruments. It
    also carries organization, user, group, project and license administration. The
    endpoint is publicly reachable and answers anonymous GraphQL introspection, but
    every query and mutation returns 401 Unauthorized without a customer session:
    this is a product API for SYNTAX owners, not a published developer API. DNA Script
    publishes no developer portal, reference documentation, SDK or OpenAPI for it.'
