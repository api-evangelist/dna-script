governance_observations:
- id: anonymous-introspection-enabled
  note: >-
    The production GraphQL endpoint answers full schema introspection without
    credentials, while all queries and mutations require a session. Publishing a
    contract is good; the common governance guidance is to either disable
    introspection in production or publish the schema deliberately as a supported
    developer artifact. Right now it is neither documented nor disabled.
- id: no-public-api-program
  note: >-
    There is no developer portal, no reference documentation, no SDK, no
    changelog, no status page and no terms covering API use. The SYNTAX Console
    API is a product-internal surface, so the whole developer-ergonomics facet is
    genuinely absent rather than merely unlinked.
