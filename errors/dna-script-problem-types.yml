format_note: >-
  Not RFC 9457. Two distinct error envelopes were observed, and neither uses
  application/problem+json. DNA Script publishes no error reference, so no code
  registry could be searched — the catalogue below is derived strictly from the
  introspected schema and from responses actually observed on the wire.
