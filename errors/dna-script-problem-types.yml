    path: /mcp
    note: served by nginx as HTML, not JSON
- id: graphql
  layer: GraphQL response body (HTTP 200)
  content_type: application/json
  shape:
    data: object|null
    errors: array of GraphQL error objects
  note: >-
    Standard GraphQL error array. Not observed populated — only the introspection
    query was issued and it succeeded; no data query was attempted.
- id: domain
  layer: application payload
  schema_type: ErrorDTO
